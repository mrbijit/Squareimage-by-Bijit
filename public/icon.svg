<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer 1:1 Ratio Board Border / Guidelines -->
  <rect x="76" y="76" width="360" height="360" rx="28" fill="#ffffff" filter="url(#dropShadow)" />

  <!-- Inner Non-Cropped Landscape/Portrait Representation placed on 1:1 Whiteboard -->
  <rect x="116" y="146" width="280" height="220" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Image content inside non-cropped area -->
  <g transform="translate(116, 146)">
    <clipPath id="innerClip">
      <rect width="280" height="220" rx="14" />
    </clipPath>
    <g clip-path="url(#innerClip)">
      <rect width="280" height="220" fill="url(#photoGrad)" opacity="0.15" />
      <!-- Mountains/Scenery in the photo -->
      <polygon points="40,190 110,90 170,170 210,120 270,190" fill="#6366f1" opacity="0.75" />
      <circle cx="210" cy="70" r="22" fill="#f59e0b" />
      <rect x="0" y="180" width="280" height="40" fill="#4f46e5" opacity="0.4" />
    </g>
  </g>

  <!-- Aspect Ratio Indicators (1:1 Ratio Stamp) -->
  <rect x="186" y="380" width="140" height="32" rx="8" fill="#0f172a" />
  <text x="256" y="401" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1:1 WHITEBOARD</text>

  <!-- Corner Guide marks showing true 1:1 square canvas -->
  <path d="M 96,116 L 96,96 L 116,96" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M 416,116 L 416,96 L 396,96" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M 96,396 L 96,416 L 116,416" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M 416,396 L 416,416 L 396,416" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
</svg>
